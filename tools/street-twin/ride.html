<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unfold — Street insights</title><base href="{{ public_path }}">
<link rel="stylesheet" href="assets/ride.css?v={{ asset_version }}">
<script type="module" src="assets/ride.js?v={{ asset_version }}"></script>
</head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="Unfold home"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m4 24 7-5 10 5 7-5V6l-7 5-10-5-7 5v13Z M11 6v13 M21 11v13" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>Unfold</a><span class="edition">See the street. Clear the way.</span><nav><a class="find-button" href="discover">Find risk clips <span aria-hidden="true">↗</span></a></nav></header>
<div id="error-banner" class="error-banner" role="alert" hidden></div>
<main class="cockpit" aria-label="The street story">
<div id="stage" aria-label="The street rebuilt in 3D from indexed video"></div><div class="scrim"></div>
<header class="head"><p class="eyebrow">Insights &amp; recommendations</p><h1 id="headline">Rebuilding the street…</h1><div id="recommendations"></div><p class="sub" id="sub"></p><button class="go" id="go">Play the story</button></header>
<div class="speed" id="speed" aria-hidden="true">Crossing · 0.4×</div>
<section class="card" id="card" aria-live="polite"></section>
<canvas class="mini" id="mini" aria-label="The street from above"></canvas>
<div class="bar"><button id="play">Play</button><canvas id="scrub" tabindex="0" aria-label="Ride timeline; click or drag to seek"></canvas><span class="clock" id="clock">0.0 s</span><div class="views" role="group" aria-label="Camera"><button data-view="director" aria-pressed="true">Story</button><button data-view="chase" aria-pressed="false">Rider</button><button data-view="overview" aria-pressed="false">Street</button><button data-view="free" aria-pressed="false">Explore</button><button id="video-toggle" aria-pressed="true" aria-controls="evidence-video">Video</button><button id="seen" aria-pressed="true">Sightlines</button><button id="cloud" aria-pressed="true">Points</button></div></div>
</main>
<section id="policy-report" class="policy-report" hidden aria-label="Recommendation detail"></section>
<figure class="pip" id="evidence-video" hidden><div class="frame"><video id="vid" playsinline muted controls preload="auto"></video><canvas id="ov"></canvas></div><figcaption><span id="video-label">Video · synced</span><button id="overlay-mode">Sightlines</button></figcaption></figure>
</body></html>
